name: Trigger Vercel Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'blog-posts.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -s -X POST "https://api.vercel.com/v1/integrations/deploy/prj_mykqmFsb0lllMTNHpggGiTwmzQPv/dX448nYmAO" \
            -o /dev/null -w "HTTP %{http_code}\n"
